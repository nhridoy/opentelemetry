# Observability stack: OTel Collector + Tempo + Prometheus + Loki + Pyroscope + Grafana.
# Runs on its own server, separate from the Django server. Copy this file and
# the observability/ folder there, put OTLP_USERNAME / OTLP_PASSWORD /
# PYROSCOPE_USERNAME / PYROSCOPE_PASSWORD / GRAFANA_ADMIN_PASSWORD /
# GRAFANA_ROOT_URL in a .env next to it, then:
#
#   docker compose -f docker-compose.observability.yml up -d
#
# Deployed with Dokploy: no host ports are published. Add domains in the
# Dokploy UI (HTTPS on): otel.<domain> → otel-collector:4318,
# profiles.<domain> → pyroscope-auth:80 and grafana.<domain> → grafana:3000.
# Django server .env:
#   OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.<domain>
#   OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic%20<base64 of user:password>
#   PYROSCOPE_SERVER_ADDRESS=https://profiles.<domain> + PYROSCOPE_USERNAME/PASSWORD
# Design: docs/superpowers/plans/2026-10-07-opentelemetry.md

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: ${CONTAINER_PREFIX:-lumicore}-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # OTLP ingest credentials (basic auth); refuse to start without them.
      OTLP_USERNAME: ${OTLP_USERNAME:?set OTLP_USERNAME in .env}
      OTLP_PASSWORD: ${OTLP_PASSWORD:?set OTLP_PASSWORD in .env}
    # No published port: the reverse proxy (Dokploy/Traefik domain) reaches it on
    # the Docker network. otel.<domain> → this service, container port 4318.
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - prometheus
      - loki

  # Tempo, Loki and Pyroscope run as uid 10001; give them their data volumes.
  # Uses busybox because their images are distroless (no chown inside).
  volume-init:
    image: busybox:1.37
    restart: "no"  # one-shot: chown then exit; never restart it
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo", "/loki", "/pyroscope"]
    volumes:
      - tempo_data:/var/tempo
      - loki_data:/loki
      - pyroscope_data:/pyroscope

  tempo:
    image: grafana/tempo:2.10.8
    container_name: ${CONTAINER_PREFIX:-lumicore}-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      volume-init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.7.8
    container_name: ${CONTAINER_PREFIX:-lumicore}-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # Continuous profiling. v1 storage (single binary); Pyroscope 2's default v2
  # storage needs its metastore cluster. Not exposed: pyroscope-auth fronts it.
  pyroscope:
    image: grafana/pyroscope:2.1.2
    container_name: ${CONTAINER_PREFIX:-lumicore}-pyroscope
    restart: unless-stopped
    command:
      - -architecture.storage=v1
      - -write-path=ingester
      - -pyroscopedb.data-path=/pyroscope/data
      - -storage.filesystem.dir=/pyroscope/shared
      - -compactor.data-dir=/pyroscope/compactor
      - -self-profiling.disable-push=true
      - -usage-stats.enabled=false
    volumes:
      - pyroscope_data:/pyroscope
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # Pyroscope has no login: this nginx checks basic auth, then proxies to it.
  # profiles.<domain> → this service, container port 80.
  pyroscope-auth:
    image: nginx:1.29-alpine
    container_name: ${CONTAINER_PREFIX:-lumicore}-pyroscope-auth
    restart: unless-stopped
    environment:
      # Rendered into the htpasswd file at start; refuse to start without them.
      PYROSCOPE_USERNAME: ${PYROSCOPE_USERNAME:?set PYROSCOPE_USERNAME in .env}
      PYROSCOPE_PASSWORD: ${PYROSCOPE_PASSWORD:?set PYROSCOPE_PASSWORD in .env}
    volumes:
      - ./observability/pyroscope-auth:/etc/nginx/templates:ro
    depends_on:
      - pyroscope

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: ${CONTAINER_PREFIX:-lumicore}-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.0.10
    container_name: ${CONTAINER_PREFIX:-lumicore}-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Refuse to start without a real password (same fail-closed rule as Flower).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    # No published port (host 3000 is Dokploy's own UI): grafana.<domain> →
    # this service, container port 3000, via the Dokploy/Traefik domain.
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
      - loki
      - pyroscope

volumes:
  tempo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  pyroscope_data:
