# Grafana Loki (single binary, local disk). Receives logs from the Collector
# over Loki's native OTLP endpoint (/otlp).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h  # 7 days
  allow_structured_metadata: true  # OTLP trace_id / span_id land here

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
